<!doctype html>
<html lang="pt-BR">
  <head>
    <base target="_top">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px; color: #243142; font: 14px/1.45 Arial, sans-serif; background: #f6f7f8; }
      h1 { margin: 0 0 6px; font-size: 20px; }
      p { margin: 0 0 16px; color: #627083; }
      form { display: grid; gap: 13px; }
      label, legend { font-weight: 700; }
      .field { display: grid; gap: 5px; }
      input, select, textarea, button { width: 100%; min-height: 40px; font: inherit; }
      input, select, textarea { padding: 8px 10px; border: 1px solid #bdc5ce; border-radius: 8px; background: #fff; }
      textarea { min-height: 70px; resize: vertical; }
      fieldset { display: grid; gap: 8px; margin: 0; padding: 10px; border: 1px solid #ccd2d8; border-radius: 8px; }
      fieldset label { display: flex; align-items: center; gap: 8px; font-weight: 400; }
      fieldset input { width: 18px; min-height: 18px; }
      button { border: 0; border-radius: 999px; color: #fff; font-weight: 700; background: #274f78; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { min-height: 42px; padding: 10px; border-radius: 8px; background: #eef1f4; }
      #status.success { color: #226342; background: #eaf8f0; }
      #status.error { color: #913737; background: #fff0f0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>Registrar resposta</h1>
    <p>Este registro usa as mesmas regras do RSVP público e será marcado como canal MANUAL.</p>
    <form id="manual-form">
      <div class="field"><label for="origin">Origem</label><select id="origin" name="origem" required><option value="HANNAH">Hannah</option><option value="NOAH">Noah</option><option value="VAGNER">Vagner</option></select></div>
      <div class="field"><label for="name">Responsável ou família</label><input id="name" name="nome_responsavel" minlength="2" maxlength="120" required></div>
      <div class="field"><label for="phone">Telefone com DDD</label><input id="phone" name="telefone" type="tel" required></div>
      <fieldset><legend>Presença</legend><label><input type="radio" name="presenca" value="SIM" required> Sim</label><label><input type="radio" name="presenca" value="NAO" required> Não</label></fieldset>
      <div class="field" id="quantity-wrap" hidden><label for="quantity">Quantidade total</label><input id="quantity" name="quantidade" type="number" min="1" max="20"></div>
      <div class="field"><label for="companions">Acompanhantes</label><textarea id="companions" name="acompanhantes" maxlength="500"></textarea></div>
      <div class="field"><label for="note">Observação</label><textarea id="note" name="observacao" maxlength="1000"></textarea></div>
      <button id="submit" type="submit">Registrar</button>
      <div id="status" role="status" aria-live="polite">Preencha os dados acima.</div>
    </form>
    <script>
      const form = document.querySelector('#manual-form');
      const status = document.querySelector('#status');
      const button = document.querySelector('#submit');
      const quantityWrap = document.querySelector('#quantity-wrap');
      const quantity = document.querySelector('#quantity');

      form.addEventListener('change', (event) => {
        if (event.target.name !== 'presenca') return;
        const attending = event.target.value === 'SIM';
        quantityWrap.hidden = !attending;
        quantity.required = attending;
        if (!attending) quantity.value = '';
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        button.disabled = true;
        status.className = '';
        status.textContent = 'Registrando…';
        const payload = Object.fromEntries(new FormData(form).entries());
        google.script.run
          .withSuccessHandler((result) => {
            button.disabled = false;
            status.className = result.ok ? 'success' : 'error';
            status.textContent = result.ok ? 'Resposta registrada.' : result.message;
            if (result.ok) {
              form.reset();
              quantityWrap.hidden = true;
              quantity.required = false;
            }
          })
          .withFailureHandler(() => {
            button.disabled = false;
            status.className = 'error';
            status.textContent = 'Não foi possível registrar. Tente novamente.';
          })
          .submitManual(payload);
      });
    </script>
  </body>
</html>
